<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f7f1e7">
<title>Kelola Kode Redeem — WA Reaction Admin</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
:root{
    --paper:#f7f1e7;
    --white:#fffdf9;
    --ink:#111111;
    --muted:#686868;
    --pink:#ff6698;
    --pink2:#ff8db2;
    --yellow:#ffb52e;
    --green:#27d56b;
    --line:#111111;
    --shadow:7px 7px 0 #111111;
}

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}

body{
    min-height:100vh;
    background:var(--paper);
    color:var(--ink);
    font-family:Arial,Helvetica,sans-serif;
    overflow-x:hidden;
}

body:before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    opacity:.08;
    background-image:radial-gradient(#111 0.7px,transparent 0.7px);
    background-size:8px 8px;
}

a{text-decoration:none;color:inherit}

.wrap{
    width:min(100% - 30px, 780px);
    margin:auto;
}

.topbar{
    position:sticky;
    top:0;
    z-index:20;
    background:rgba(247,241,231,.94);
    border-bottom:2px solid var(--ink);
    backdrop-filter:blur(10px);
}

.topbar-inner{
    min-height:66px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
}

.brand{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:17px;
    font-weight:900;
    letter-spacing:-.5px;
}

.brand-icon{
    width:38px;
    height:38px;
    display:grid;
    place-items:center;
    background:var(--pink);
    border:3px solid var(--ink);
    box-shadow:3px 3px 0 var(--ink);
    border-radius:11px;
    font-size:18px;
    color:var(--ink);
}

.nav-links{
    display:flex;
    gap:8px;
}

.nav-links a,
.nav-links button{
    padding:9px 13px;
    background:#fff;
    border:2px solid var(--ink);
    box-shadow:2px 2px 0 var(--ink);
    font-size:11px;
    font-weight:800;
    border-radius:8px;
    cursor:pointer;
    transition:.12s ease;
    color:var(--ink);
    text-decoration:none;
    display:inline-flex;
    align-items:center;
    gap:5px;
}

.nav-links a:hover,
.nav-links button:hover{
    transform:translate(-1px,-1px);
    box-shadow:3px 3px 0 var(--ink);
}

.page-head{
    padding:42px 0 28px;
}

.page-badge{
    display:inline-flex;
    align-items:center;
    gap:7px;
    padding:8px 14px;
    margin-bottom:16px;
    background:var(--green);
    border:3px solid var(--ink);
    box-shadow:var(--shadow);
    font-size:11px;
    font-weight:900;
    text-transform:uppercase;
    border-radius:3px;
}

.page-badge i{margin-right:4px}

.page-head h1{
    font-size:clamp(32px,8vw,52px);
    line-height:.95;
    letter-spacing:-2.5px;
    font-weight:950;
}

.card{
    background:var(--white);
    border:3px solid var(--ink);
    box-shadow:var(--shadow);
    border-radius:3px;
    margin-bottom:20px;
}

.card-body{padding:22px 24px}

.card-title{
    display:flex;
    align-items:center;
    gap:10px;
    padding:18px 24px;
    border-bottom:2.5px solid var(--ink);
    font-size:16px;
    font-weight:950;
    letter-spacing:-.4px;
}

.card-title i{
    color:var(--pink);
    font-size:18px;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:12px;
    margin-bottom:14px;
}

.form-field{
    margin-bottom:0;
}

.form-field label{
    display:block;
    font-size:11px;
    font-weight:900;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:.3px;
    margin-bottom:6px;
}

.form-field input{
    width:100%;
    padding:11px 14px;
    border:2.5px solid var(--ink);
    border-radius:8px;
    font-size:13px;
    font-weight:700;
    background:var(--white);
}

.form-field input:focus{
    outline:none;
    background:var(--yellow);
}

.form-hint{
    font-size:10px;
    color:var(--muted);
    font-weight:700;
    margin-top:4px;
}

.form-actions{
    display:flex;
    gap:10px;
}

.action-btn{
    flex:1;
    padding:12px 16px;
    border:2.5px solid var(--ink);
    border-radius:8px;
    font-size:12px;
    font-weight:900;
    cursor:pointer;
    transition:.12s ease;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    background:#fff;
}

.action-btn:hover{
    transform:translate(-1px,-1px);
    box-shadow:3px 3px 0 var(--ink);
}

.action-btn.green{background:var(--green)}
.action-btn.yellow{background:var(--yellow)}
.action-btn.pink{background:var(--pink)}

.action-btn:disabled{
    opacity:.6;
    cursor:wait;
}

.codes-table{
    width:100%;
    border-collapse:collapse;
}

.codes-table tr:not(:last-child){
    border-bottom:1.5px solid #e8e1d8;
}

.codes-table td{
    padding:14px 0;
    font-size:13px;
    vertical-align:middle;
}

.codes-table td:first-child{
    font-weight:900;
    font-family:monospace;
    font-size:12px;
}

.code-badge{
    display:inline-flex;
    align-items:center;
    padding:6px 12px;
    background:var(--yellow);
    border:2px solid var(--ink);
    border-radius:5px;
    font-size:12px;
    font-weight:900;
}

.status-active{
    display:inline-flex;
    align-items:center;
    gap:4px;
    padding:4px 8px;
    background:#e8f5e9;
    border:1.5px solid var(--green);
    border-radius:4px;
    font-size:11px;
    font-weight:800;
    color:#27d56b;
}

.status-inactive{
    display:inline-flex;
    align-items:center;
    gap:4px;
    padding:4px 8px;
    background:#ffebee;
    border:1.5px solid var(--pink);
    border-radius:4px;
    font-size:11px;
    font-weight:800;
    color:#ff6698;
}

.user-counter{
    display:inline-flex;
    align-items:center;
    gap:3px;
    font-size:12px;
    font-weight:900;
}

.user-counter.maxed{
    color:var(--pink);
}

.code-actions{
    display:flex;
    gap:6px;
}

.code-action-btn{
    padding:6px 10px;
    border:2px solid var(--ink);
    border-radius:6px;
    font-size:11px;
    font-weight:800;
    cursor:pointer;
    transition:.12s ease;
    background:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:4px;
}

.code-action-btn:hover{
    transform:translate(-1px,-1px);
    box-shadow:2px 2px 0 var(--ink);
}

.code-action-btn.toggle{background:var(--yellow)}
.code-action-btn.delete{background:var(--pink)}

.empty-state{
    text-align:center;
    padding:40px 20px;
    color:var(--muted);
}

.empty-state i{
    font-size:48px;
    margin-bottom:16px;
    opacity:.5;
}

.empty-state h3{
    font-size:16px;
    font-weight:900;
    margin-bottom:6px;
    color:var(--ink);
}

.global-info-bar{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    padding:12px 16px;
    background:var(--paper);
    border:2px solid var(--ink);
    border-radius:8px;
    margin-bottom:18px;
    font-size:12px;
    font-weight:800;
    color:var(--muted);
}

.global-info-bar span{
    display:flex;
    align-items:center;
    gap:5px;
}

.global-info-bar strong{
    color:var(--ink);
}

/* ── UNIFIED ALERT SYSTEM ── */
.alert{
    display:none;
    margin-top:14px;
    border:2.5px solid var(--ink);
    border-radius:10px;
    font-size:13px;
    font-weight:800;
    line-height:1.55;
    overflow:hidden;
    animation:alertIn .2s cubic-bezier(.34,1.3,.64,1);
}

@keyframes alertIn{
    from{opacity:0;transform:translateY(-8px) scale(.97)}
    to{opacity:1;transform:translateY(0) scale(1)}
}

.alert.show{display:flex;align-items:stretch}
.alert-stripe{width:5px;flex-shrink:0;border-right:2px solid rgba(0,0,0,.12)}
.alert-inner{display:flex;align-items:flex-start;gap:11px;padding:13px 15px;flex:1}
.alert-icon{font-size:15px;flex-shrink:0;margin-top:1px}
.alert-body{flex:1;white-space:pre-wrap;word-break:break-word}

.alert.success{ border-color:var(--green); box-shadow:4px 4px 0 var(--green); }
.alert.success .alert-stripe{ background:var(--green); }
.alert.success .alert-inner{ background:#edfff5; color:#0d3d23; }
.alert.success .alert-icon{ color:var(--green); }

.alert.error{ border-color:var(--pink); box-shadow:4px 4px 0 var(--pink); }
.alert.error .alert-stripe{ background:var(--pink); }
.alert.error .alert-inner{ background:#fff0f4; color:#8b0030; }
.alert.error .alert-icon{ color:var(--pink); }

.alert.info{ border-color:var(--ink); box-shadow:4px 4px 0 var(--ink); }
.alert.info .alert-stripe{ background:var(--ink); }
.alert.info .alert-inner{ background:var(--white); color:var(--ink); }
.alert.info .alert-icon{ color:var(--ink); }

/* ── Toast ── */
.toast{
    position:fixed;
    bottom:28px;
    left:50%;
    transform:translateX(-50%) translateY(24px);
    background:var(--ink);
    color:#fff;
    padding:11px 20px;
    border-radius:50px;
    font-size:13px;
    font-weight:800;
    opacity:0;
    transition:opacity .22s ease, transform .22s cubic-bezier(.34,1.3,.64,1);
    pointer-events:none;
    z-index:500;
    white-space:nowrap;
    display:flex;
    align-items:center;
    gap:8px;
    border:2.5px solid rgba(255,255,255,.15);
    box-shadow:0 6px 24px rgba(17,17,17,.35);
    max-width:calc(100vw - 40px);
}

.toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

.toast.t-success{ background:var(--green); color:var(--ink); border-color:rgba(0,0,0,.15); }
.toast.t-error  { background:var(--pink);  color:var(--ink); border-color:rgba(0,0,0,.15); }

.footer{
    padding:35px 0 45px;
    text-align:center;
    color:#666;
    font-size:12px;
}

.footer strong{color:var(--ink)}

@media(max-width:600px){
    .form-grid{grid-template-columns:1fr}
    .code-actions{flex-wrap:wrap}
}
</style>
</head>
<body>

<header class="topbar">
    <div class="wrap topbar-inner">
        <div class="brand">
            <div class="brand-icon"><i class="fas fa-key"></i></div>
            <span>REDEEM CODES</span>
        </div>
        <div class="nav-links">
            <a href="/admin.html"><i class="fas fa-arrow-left"></i> Kembali</a>
        </div>
    </div>
</header>

<main class="wrap">
    <div class="page-head">
        <div class="page-badge"><i class="fas fa-gift"></i> KELOLA KODE</div>
        <h1>Redeem Codes</h1>
    </div>

    <div class="global-info-bar">
        <span><i class="fas fa-bolt" style="color:var(--pink)"></i> Default generate: <strong id="infoGenerate">1 kode</strong></span>
        <span><i class="fas fa-plus-circle" style="color:var(--green)"></i> Default bonus: <strong id="infoBonus">+5 limit</strong></span>
        <span><i class="fas fa-users" style="color:var(--yellow);-webkit-text-stroke:1px var(--ink)"></i> Max user/kode: <strong id="infoMax">Tidak Terbatas</strong></span>
        <a href="/admin.html#settings" style="margin-left:auto;color:var(--pink);font-weight:900;display:flex;align-items:center;gap:4px;font-size:11px"><i class="fas fa-cog"></i> Ubah Settings</a>
    </div>

    <div class="card">
        <div class="card-title"><i class="fas fa-wand-magic-sparkles"></i> Buat Kode Baru</div>
        <div class="card-body">
            <form id="generateForm">
                <div class="form-grid">
                    <div class="form-field">
                        <label><i class="fas fa-hashtag"></i> Jumlah Kode</label>
                        <input type="number" id="countInput" min="1" max="500" value="1" required>
                        <div class="form-hint">Default dari settings global</div>
                    </div>
                    <div class="form-field">
                        <label><i class="fas fa-plus"></i> Bonus Limit</label>
                        <input type="number" id="bonusInput" min="1" max="9999" value="5" required>
                        <div class="form-hint" id="bonusHint">Override per-kode</div>
                    </div>
                    <div class="form-field" style="display:flex;flex-direction:column;justify-content:flex-end">
                        <button type="submit" class="action-btn green"><i class="fas fa-sparkles"></i> Generate</button>
                    </div>
                </div>
            </form>
            <div id="generateResult" class="alert"></div>
        </div>
    </div>

    <div class="card">
        <div class="card-title"><i class="fas fa-list"></i> Daftar Kode (<span id="codeCount">0</span>)</div>
        <div class="card-body" id="codesContainer"></div>
    </div>
</main>

<footer class="footer">
    <strong>WA Reaction Redeem Manager</strong> — Admin Only
</footer>

<div class="toast" id="toast"></div>

<script>
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function showAlert(el,type,html){const icons={success:'fa-check-circle',error:'fa-exclamation-circle',warning:'fa-triangle-exclamation',info:'fa-circle-notch fa-spin'};el.className='alert show '+type;el.innerHTML='<div class="alert-stripe"></div><div class="alert-inner"><i class="alert-icon fas '+(icons[type]||icons.info)+'"></i><div class="alert-body">'+html+'</div></div>'}
function showToast(msg,isError){const t=document.getElementById('toast');const icon=isError?'fa-exclamation-circle':'fa-check-circle';t.className='toast'+(isError?' t-error':' t-success');t.innerHTML='<i class="fas '+icon+'"></i> '+String(msg).replace(/^[✅❌🗑️⚠️]\s*/u,'');t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2800)}
async function api(path, options={}){const res=await fetch(path,{...options,credentials:'same-origin',cache:'no-store',headers:{'Accept':'application/json',...(options.headers||{})}});const data=await res.json().catch(()=>({ok:false,message:'Response server tidak valid.'}));if(!res.ok && data.ok===undefined)data.ok=false;return data}
async function loadPage(){
  try{
    const [settings,codes]=await Promise.all([api('/api/settings'),api('/api/redeem?action=list')]);
    if(!settings.ok || !codes.ok){location.href='/';return}
    const s=settings.settings; document.getElementById('infoGenerate').textContent=s.generate_count+' kode';document.getElementById('infoBonus').textContent='+'+s.bonus_limit+' limit';document.getElementById('infoMax').textContent=s.max_redeem_users>0?s.max_redeem_users+' user':'Tidak Terbatas';
    document.getElementById('countInput').value=s.generate_count;document.getElementById('bonusInput').value=s.bonus_limit;document.getElementById('bonusHint').textContent='Override per-kode (global: +'+s.bonus_limit+')';
    renderCodes(codes.codes,s.max_redeem_users);
  }catch(e){location.href='/'}
}
function renderCodes(codes,maxUsers){
  document.getElementById('codeCount').textContent=codes.length;
  const box=document.getElementById('codesContainer');
  if(!codes.length){box.innerHTML='<div class="empty-state"><i class="fas fa-inbox"></i><h3>Belum ada kode</h3><p>Buat kode redeem pertama Anda menggunakan form di atas.</p></div>';return}
  box.innerHTML='<table class="codes-table"><thead><tr style="border-bottom:2px solid var(--ink)"><th style="text-align:left;font-size:11px;font-weight:900;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;padding:10px 0">Kode</th><th style="text-align:center;font-size:11px;font-weight:900;color:var(--muted);text-transform:uppercase;padding:10px 0">Bonus</th><th style="text-align:center;font-size:11px;font-weight:900;color:var(--muted);text-transform:uppercase;padding:10px 0">Digunakan</th><th style="text-align:center;font-size:11px;font-weight:900;color:var(--muted);text-transform:uppercase;padding:10px 0">Status</th><th style="text-align:right;font-size:11px;font-weight:900;color:var(--muted);text-transform:uppercase;padding:10px 0">Aksi</th></tr></thead><tbody>'+
  codes.map(c=>{const used=Number(c.used_count||0),maxed=maxUsers>0&&used>=maxUsers;return '<tr><td><span class="code-badge" data-code="'+esc(c.code)+'">'+esc(c.code)+'</span></td><td style="text-align:center"><strong>+'+Number(c.bonus_limit)+'</strong></td><td style="text-align:center"><span class="user-counter'+(maxed?' maxed':'')+'">'+(maxUsers>0?'<i class="fas fa-users" style="font-size:10px"></i> '+used+'/'+maxUsers+(maxed?' <i class="fas fa-lock" style="font-size:9px"></i>':''):used)+'</span></td><td style="text-align:center">'+(c.is_active?'<span class="status-active"><i class="fas fa-check-circle"></i> Aktif</span>':'<span class="status-inactive"><i class="fas fa-ban"></i> Nonaktif</span>')+'</td><td style="text-align:right"><div class="code-actions"><button type="button" class="code-action-btn toggle" data-action="toggle" data-code="'+esc(c.code)+'"><i class="fas fa-power-off"></i></button><button type="button" class="code-action-btn delete" data-action="delete" data-code="'+esc(c.code)+'"><i class="fas fa-trash"></i></button></div></td></tr>'}).join('')+'</tbody></table>';
}
document.getElementById('generateForm').addEventListener('submit',async function(e){e.preventDefault();const count=+document.getElementById('countInput').value,bonus=+document.getElementById('bonusInput').value,result=document.getElementById('generateResult'),btn=this.querySelector('button');if(count<1||count>500||bonus<1||bonus>9999){showToast('❌ Input tidak valid',true);return}btn.disabled=true;btn.innerHTML='<i class="fas fa-spinner fa-spin"></i> Membuat...';try{const d=await api('/api/redeem',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':window.__csrf||''},body:JSON.stringify({action:'generate',count,bonus})});if(d.ok){showAlert(result,'success','<strong>'+esc(d.message)+'</strong><br><br><span style="font-size:11px;text-transform:uppercase;opacity:.7">Kode yang dibuat:</span><br>'+d.codes.map(c=>'<code style="display:inline-block;margin:3px 3px 0 0;padding:4px 10px;background:#fff;border:2px solid var(--green);border-radius:6px;font-weight:900;font-family:monospace">'+esc(c)+'</code>').join(''));showToast('Kode berhasil dibuat');setTimeout(loadPage,600)}else{showAlert(result,'error',esc(d.message));showToast(d.message,true)}}catch(e){showAlert(result,'error','Tidak dapat menghubungi server.');showToast('Tidak dapat menghubungi server.',true)}finally{btn.disabled=false;btn.innerHTML='<i class="fas fa-sparkles"></i> Generate'}});
document.getElementById('codesContainer').addEventListener('click',async e=>{const b=e.target.closest('button[data-action]');if(!b)return;const code=b.dataset.code,action=b.dataset.action;if(!confirm((action==='delete'?'Hapus kode ':'Toggle status kode ')+code+'?'+(action==='delete'?' Aksi ini tidak dapat dibatalkan.':'')))return;try{const d=await api('/api/redeem',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':window.__csrf||''},body:JSON.stringify({action,code})});showToast((d.ok?'✅ ':'❌ ')+(d.message||''),!d.ok);if(d.ok)loadPage()}catch(e){showToast('❌ Error',true)}});
(async()=>{const m=await api('/api/auth?action=me');if(!m.ok){location.href='/';return}window.__csrf=m.csrf;loadPage()})();
</script>

</body>
</html>
